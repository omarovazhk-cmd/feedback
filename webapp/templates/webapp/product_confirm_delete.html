{% extends "webapp/base.html" %}

{% block content %}
    <h2>Delete "{{ object.name }}"?</h2>

    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">Delete</button>
        <a href="{% url 'webapp:product_detail' object.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
