{% load static %}

<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FEEDBACK{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'webapp:product_list' %}">FEEDBACK</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNavAltMarkup">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'webapp:product_list' %}">Products</a>
                <a class="nav-link" href="{% url 'webapp:product_create' %}">Add product</a>

                {% block menu %}{% endblock %}

                {% if request.user.is_authenticated %}
                    <span class="nav-link">Hello, {{ request.user.username }}</span>
                    <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
                        {% csrf_token %}
                        <button class="btn btn-link nav-link text-white p-0 m-0" type="submit">Logout</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'accounts:login' %}">Login</a>
                    <a class="nav-link" href="{% url 'accounts:register' %}">Registration</a>
                {% endif %}

            </div>
        </div>
    </div>
</nav>

<div class="container py-4">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
